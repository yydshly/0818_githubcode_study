name: Deploy research showcase to Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - ".gitmodules"
      - "site/**"
      - "projects/luopan/**"
      - "projects/hand-drawn-styles/**"
      - "projects/stamp-edge-skill/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and research sources
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/projects/luopan/upstream
          cp site/index.html site/styles.css _site/
          cp -R projects/luopan/showcase _site/projects/luopan/showcase
          cp -R projects/luopan/applied _site/projects/luopan/applied
          cp -R projects/luopan/docs _site/projects/luopan/docs
          cp -R projects/luopan/research _site/projects/luopan/research
          cp -R projects/luopan/extension _site/projects/luopan/extension
          cp -R projects/luopan/upstream/test-output _site/projects/luopan/upstream/test-output
          cp -R projects/luopan/upstream/review-output _site/projects/luopan/upstream/review-output
          mkdir -p _site/projects/hand-drawn-styles/upstream/examples
          mkdir -p _site/projects/hand-drawn-styles/upstream/scripts
          mkdir -p _site/projects/hand-drawn-styles/upstream/benchmarks/style-3.1
          mkdir -p _site/projects/hand-drawn-styles/upstream/assets/style-3.1
          cp -R projects/hand-drawn-styles/showcase _site/projects/hand-drawn-styles/showcase
          cp -R projects/hand-drawn-styles/docs _site/projects/hand-drawn-styles/docs
          cp projects/hand-drawn-styles/README.md _site/projects/hand-drawn-styles/README.md
          cp projects/hand-drawn-styles/upstream/README.md projects/hand-drawn-styles/upstream/PROTOCOL.md projects/hand-drawn-styles/upstream/STYLES.md projects/hand-drawn-styles/upstream/LICENSE _site/projects/hand-drawn-styles/upstream/
          cp projects/hand-drawn-styles/upstream/scripts/render_prompt.py projects/hand-drawn-styles/upstream/scripts/test_render_prompt.py _site/projects/hand-drawn-styles/upstream/scripts/
          cp projects/hand-drawn-styles/upstream/benchmarks/README.md _site/projects/hand-drawn-styles/upstream/benchmarks/README.md
          cp projects/hand-drawn-styles/upstream/benchmarks/style-3.1/README.md _site/projects/hand-drawn-styles/upstream/benchmarks/style-3.1/README.md
          cp projects/hand-drawn-styles/upstream/assets/style-3.1/anchor-family.png _site/projects/hand-drawn-styles/upstream/assets/style-3.1/anchor-family.png
          cp projects/hand-drawn-styles/upstream/examples/README.md _site/projects/hand-drawn-styles/upstream/examples/README.md
          cp projects/hand-drawn-styles/upstream/examples/01-minimal-line.png projects/hand-drawn-styles/upstream/examples/02-crayon.png projects/hand-drawn-styles/upstream/examples/04-bean-doodle.png projects/hand-drawn-styles/upstream/examples/05-ms-paint.png projects/hand-drawn-styles/upstream/examples/07-real-crayon.png projects/hand-drawn-styles/upstream/examples/10-emo-sketch.png projects/hand-drawn-styles/upstream/examples/11-retro-concept.png projects/hand-drawn-styles/upstream/examples/13-paper-folk.png projects/hand-drawn-styles/upstream/examples/15-softnose-vinyl.png projects/hand-drawn-styles/upstream/examples/17-inked-storybook.png projects/hand-drawn-styles/upstream/examples/18-warm-flat-storybook.png _site/projects/hand-drawn-styles/upstream/examples/
          mkdir -p _site/projects/stamp-edge-skill
          cp -R projects/stamp-edge-skill/showcase _site/projects/stamp-edge-skill/showcase
          cp -R projects/stamp-edge-skill/docs _site/projects/stamp-edge-skill/docs
          cp -R projects/stamp-edge-skill/demo _site/projects/stamp-edge-skill/demo
          cp -R projects/stamp-edge-skill/extension _site/projects/stamp-edge-skill/extension
          cp projects/stamp-edge-skill/README.md _site/projects/stamp-edge-skill/README.md

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
